<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>You're offline — Faith Companion AI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#0f0120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:400px;width:100%;text-align:center;}
  .icon{font-size:56px;line-height:1;margin-bottom:20px;}
  h1{color:#fff;font-size:22px;font-weight:700;margin-bottom:12px;}
  p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.7;margin-bottom:28px;}
  a{display:inline-block;padding:12px 28px;background:linear-gradient(to right,#7c3aed,#f97316);color:#fff;text-decoration:none;border-radius:999px;font-size:14px;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9749;</div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your connection. Some pages are available offline — check back when you're connected to continue your faith journey.</p>
    <a href="/" onclick="location.reload();return false;">Try again</a>
  </div>
</body>
</html>
